<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CreatorLab — Audio Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">C</div>
    <div><b>CreatorLab</b><small>Audio Lab · Phase 1</small></div>
    <button id="theme">☼</button>
  </header>

  <main>
    <section class="hero">
      <p>AUDIO LAB</p>
      <h1>Edit audio.<br><span>Right in your browser.</span></h1>
      <div class="drop" id="drop">
        <input id="file" type="file" accept="audio/*">
        <strong>Drop MP3 / WAV / M4A / OGG</strong>
        <small>or tap here to choose a file</small>
      </div>
      <div id="fileInfo" class="muted"></div>
    </section>

    <section id="editor" class="editor hidden">
      <div class="player panel">
        <div class="track">
          <canvas id="wave"></canvas>
          <div class="playhead" id="playhead"></div>
        </div>
        <audio id="audio" controls></audio>
      </div>

      <div class="preset-row">
        <button data-preset="normal">Normal</button>
        <button data-preset="slow">Slowed</button>
        <button data-preset="slowedReverb">Slowed + Reverb</button>
      </div>

      <div class="controls">
        <div class="panel">
          <label>Speed <output id="speedOut">1.00×</output>
          <input id="speed" type="range" min=".5" max="2" value="1" step=".01"></label>
          <label>Pitch <output id="pitchOut">0 st</output>
          <input id="pitch" type="range" min="-12" max="12" value="0" step=".1"></label>
          <label>Volume <output id="volumeOut">100%</output>
          <input id="volume" type="range" min="0" max="1" value="1" step=".01"></label>
        </div>

        <div class="panel">
          <label>Bass <output id="bassOut">0 dB</output>
          <input id="bass" type="range" min="-12" max="12" value="0" step=".5"></label>
          <label>Treble <output id="trebleOut">0 dB</output>
          <input id="treble" type="range" min="-12" max="12" value="0" step=".5"></label>
          <label>Reverb <output id="reverbOut">0%</output>
          <input id="reverb" type="range" min="0" max="100" value="0"></label>
        </div>
      </div>

      <div class="panel trim">
        <h3>Trim & Fade</h3>
        <div class="grid">
          <label>Start (sec)<input id="start" type="number" min="0" value="0" step=".01"></label>
          <label>End (sec)<input id="end" type="number" min="0" value="0" step=".01"></label>
          <label>Fade in (sec)<input id="fadeIn" type="number" min="0" value="0" step=".1"></label>
          <label>Fade out (sec)<input id="fadeOut" type="number" min="0" value="0" step=".1"></label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="play">Play / Pause</button>
        <button id="preview">Preview from start</button>
        <button class="primary" id="exportWav">Export WAV</button>
        <button class="primary" id="exportMp3">Export MP3</button>
      </div>

      <div class="export panel">
        <label>MP3 quality
          <select id="bitrate">
            <option value="320">320 kbps</option>
            <option value="256">256 kbps</option>
            <option value="192">192 kbps</option>
            <option value="128">128 kbps</option>
          </select>
        </label>
        <div id="status" class="muted">Ready.</div>
        <div class="progress"><i id="progress"></i></div>
      </div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="script.js"></script>
</body>
</html>
